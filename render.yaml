services:
  - type: web
    name: my-portfolio
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: my-portfolio-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: my-portfolio-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: my-portfolio-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: my-portfolio-db
          property: database

databases:
  - name: my-portfolio-db
    plan: free